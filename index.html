<!doctype html>
<html lang="lv" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Independent LBTU lecture timetable" />
    <title>Lekcijas</title>
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('lekcijas.preferences.v1') || 'null')
        const themes = ['light', 'dark', 'cupcake', 'synthwave', 'retro', 'valentine', 'halloween', 'garden', 'forest', 'aqua', 'lofi', 'black', 'luxury', 'dracula', 'lemonade', 'coffee', 'winter', 'dim', 'sunset', 'caramellatte', 'abyss', 'silk']
        if (saved && themes.includes(saved.theme)) document.documentElement.dataset.theme = saved.theme
        if (saved && ['lv', 'en'].includes(saved.language)) document.documentElement.lang = saved.language
      } catch { /* Preferences are optional. */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
