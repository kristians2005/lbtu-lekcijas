name: Update timetables

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timetable-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch current LBTU timetables
        id: fetch
        run: npm run data:update

      - name: Diagnose LBTU connectivity
        if: failure() && steps.fetch.outcome == 'failure'
        timeout-minutes: 3
        shell: bash
        run: |
          node --input-type=module -e "import { lookup } from 'node:dns/promises'; try { console.log(await lookup('lais.lbtu.lv', { all: true })); } catch (error) { console.error(error); process.exitCode = 1; }" || true
          for family in -4 -6; do
            echo "::group::LBTU HTTPS probe ($family)"
            curl "$family" --verbose --location --output /dev/null --connect-timeout 20 --max-time 30 'https://lais.lbtu.lv/luis/lsarG.html' || true
            echo "::endgroup::"
          done

      - name: Check for timetable changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- public/data)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.changes.outputs.changed == 'true'
        run: npm test

      - name: Lint
        if: steps.changes.outputs.changed == 'true'
        run: npm run lint

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Publish timetable changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Update timetable data"
          git push
