name: Update timetables

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timetable-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch current LBTU timetables
        run: npm run data:update

      - name: Check for timetable changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- public/data)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.changes.outputs.changed == 'true'
        run: npm test

      - name: Lint
        if: steps.changes.outputs.changed == 'true'
        run: npm run lint

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Publish timetable changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Update timetable data"
          git push
